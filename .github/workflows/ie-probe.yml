name: Probe Indian Express access

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/ie-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official endpoints
        shell: bash
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          urls = {
              "explained-rss": "https://indianexpress.com/section/explained/feed/",
              "explained-rest": "https://indianexpress.com/wp-json/wp/v2/article?ie_section=442186323&per_page=1&_fields=id,date,link,title,content",
              "opinion-rest": "https://indianexpress.com/wp-json/wp/v2/article?ie_section=352&per_page=1&_fields=id,date,link,title,content",
              "explained-rest-translate": "https://indianexpress-com.translate.goog/wp-json/wp/v2/article?ie_section=442186323&per_page=1&_fields=id,date,link,title,content&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en",
              "opinion-rest-translate": "https://indianexpress-com.translate.goog/wp-json/wp/v2/article?ie_section=352&per_page=1&_fields=id,date,link,title,content&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en",
              "current-article": "https://indianexpress.com/article/explained/explained-law/supreme-court-motor-insurance-rules-uninsured-mandatory-vehicles-10819557/",
          }
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 15; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.7922.71 Mobile Safari/537.36",
              "Accept": "application/rss+xml,application/json,text/html;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }

          for name, url in urls.items():
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      print(name, response.status, len(body))
                      print("  server:", response.headers.get("server"))
                      print("  via:", response.headers.get("via"))
                      print("  x-cache:", response.headers.get("x-cache"))
                      print("  x-amz-cf-pop:", response.headers.get("x-amz-cf-pop"))
              except urllib.error.HTTPError as error:
                  body = error.read()
                  print(name, error.code, len(body))
                  print("  server:", error.headers.get("server"))
                  print("  via:", error.headers.get("via"))
                  print("  x-cache:", error.headers.get("x-cache"))
                  print("  x-amz-cf-pop:", error.headers.get("x-amz-cf-pop"))
                  print("  body:", repr(body[:300]))
          PY
