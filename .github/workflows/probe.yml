name: Temporary News On AIR probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe News On AIR requests
        shell: bash
        run: |
          set -euo pipefail

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.7922.76 Safari/537.36'
          BASE='https://newsonair.gov.in'
          CATEGORY="$BASE/bulletins-detail-category/morning-news/"
          AJAX="$BASE/wp-admin/admin-ajax.php"
          PROBE_DIR="$(mktemp -d)"
          trap 'rm -rf "$PROBE_DIR"' EXIT

          category_status="$(curl -sS -A "$UA" -c "$PROBE_DIR/cookies" \
            -o "$PROBE_DIR/category.html" -w '%{http_code}' "$CATEGORY")"
          category_size="$(wc -c < "$PROBE_DIR/category.html")"
          echo "category status=$category_status bytes=$category_size"

          nonce="$(CATEGORY_FILE="$PROBE_DIR/category.html" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          page = Path(os.environ["CATEGORY_FILE"]).read_text(errors="replace")
          match = re.search(
              r"action:\s*['\"]filter_bulletins_details['\"].{0,500}?"
              r"security:\s*['\"]([^'\"]+)",
              page,
              re.S | re.I,
          )
          if not match:
              raise SystemExit("bulletin nonce not found")
          print(match.group(1))
          PY
          )"
          echo "nonce found=yes length=${#nonce}"

          old_status="$(curl -sS -A "$UA" -b "$PROBE_DIR/cookies" \
            -e "$CATEGORY" -H 'X-Requested-With: XMLHttpRequest' \
            -H "Origin: $BASE" -o "$PROBE_DIR/old.html" -w '%{http_code}' \
            --data 'action=filter_bulletins_details&category=morning-news&page=1' \
            "$AJAX")"
          old_size="$(wc -c < "$PROBE_DIR/old.html")"
          echo "old-request status=$old_status bytes=$old_size"
          head -c 160 "$PROBE_DIR/old.html"; echo

          current_status="$(curl -sS -A "$UA" -b "$PROBE_DIR/cookies" \
            -e "$CATEGORY" -H 'X-Requested-With: XMLHttpRequest' \
            -H "Origin: $BASE" -o "$PROBE_DIR/current.html" -w '%{http_code}' \
            --data-urlencode 'action=filter_bulletins_details' \
            --data-urlencode "security=$nonce" \
            --data-urlencode 'category=morning-news' \
            --data-urlencode 'date_from=' --data-urlencode 'date_to=' \
            --data-urlencode 'paged=1' "$AJAX")"
          current_size="$(wc -c < "$PROBE_DIR/current.html")"
          current_count="$(grep -o 'bulletins-detail/[^" ]*' "$PROBE_DIR/current.html" | wc -l)"
          echo "current-request status=$current_status bytes=$current_size items=$current_count"

          detail_url="$(grep -m1 -o 'https://newsonair.gov.in/bulletins-detail/[^" ]*' \
            "$PROBE_DIR/current.html")"
          detail_status="$(curl -sS -A "$UA" -b "$PROBE_DIR/cookies" \
            -o "$PROBE_DIR/detail.html" -w '%{http_code}' "$detail_url")"
          detail_size="$(wc -c < "$PROBE_DIR/detail.html")"
          echo "detail status=$detail_status bytes=$detail_size url=$detail_url"

          test "$category_status" = 200
          test "$current_status" = 200
          test "$current_count" -gt 0
          test "$detail_status" = 200
